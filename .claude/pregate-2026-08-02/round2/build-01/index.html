<title>Snackbar — optimistic save</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    /* colors */
    --color-bg: #050505;
    --color-bg-elev: #141414;
    --color-bg-card: #1c1c1c;
    --color-fg: #ffffff;
    --color-fg-muted: #b8b8b8;
    --color-fg-dim: #828282;
    --color-line: #363636;
    --color-line-strong: #545454;
    --color-accent: #ed4609;

    /* type */
    --type-label: 13px;
    --type-body: 16px;
    --type-lead: 20px;
    --type-h3: 27px;
    --type-h2: 56px;
    --type-h1: 96px;

    /* space */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-xxl: 48px;

    /* motion */
    --motion-duration-fast: 120ms;
    --motion-duration-base: 200ms;
    --motion-duration-slow: 400ms;
    --motion-easing-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --motion-easing-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --motion-easing-site: cubic-bezier(0.56, 0.22, 0.05, 0.99);

    /* fonts (tokens only — Untitled Sans/Domaine are licensed, not embedded here;
       fallback stacks stand in for the licensed families) */
    --font-display: "Untitled Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-body: "Untitled Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --font-serif: "Domaine Display SemiBold", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--color-bg);
    color: var(--color-fg);
    font-family: var(--font-body);
    font-size: var(--type-body);
    line-height: 1.5;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-xxl) var(--space-lg) calc(var(--space-xxl) * 3);
    gap: var(--space-xxl);
  }

  .page-head {
    max-width: 640px;
    width: 100%;
    text-align: left;
  }

  .page-head .label {
    font-size: var(--type-label);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-fg-dim);
    margin: 0 0 var(--space-sm);
  }

  .page-head h1 {
    font-size: var(--type-h3);
    font-weight: 500;
    margin: 0 0 var(--space-sm);
    letter-spacing: -0.01em;
  }

  .page-head p {
    font-size: var(--type-body);
    color: var(--color-fg-muted);
    margin: 0;
    max-width: 52ch;
  }

  hr.rule {
    width: 100%;
    max-width: 640px;
    border: none;
    border-top: 1px solid var(--color-line);
    margin: 0;
  }

  /* demo harness — a fake "document" whose title change is optimistically saved */
  .demo {
    width: 100%;
    max-width: 640px;
    border: 1px solid var(--color-line);
    background: var(--color-bg-elev);
    padding: var(--space-xl);
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
  }

  .demo__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-md);
    border-bottom: 1px solid var(--color-line);
    padding-bottom: var(--space-md);
  }

  .demo__field {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
  }

  .demo__field .k {
    font-size: var(--type-label);
    color: var(--color-fg-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .demo__field .v {
    font-size: var(--type-lead);
    font-weight: 500;
  }

  .demo__field .v.is-pending {
    color: var(--color-fg-muted);
  }

  .demo__actions {
    display: flex;
    align-items: center;
    gap: var(--space-md);
  }

  .demo__hint {
    font-size: var(--type-label);
    color: var(--color-fg-dim);
  }

  /* semantic button classes — every interactive element has a hover state */
  .btn {
    appearance: none;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: var(--type-body);
    font-weight: 500;
    cursor: pointer;
    padding: var(--space-sm) var(--space-lg);
    border-radius: 2px;
    transition: background-color var(--motion-duration-fast) var(--motion-easing-out-quart),
                border-color var(--motion-duration-fast) var(--motion-easing-out-quart),
                color var(--motion-duration-fast) var(--motion-easing-out-quart);
  }

  .btn:focus-visible {
    outline: 1px solid var(--color-fg);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--color-fg);
    color: var(--color-bg);
    border-color: var(--color-fg);
  }

  .btn-primary:hover {
    background: var(--color-fg-muted);
    border-color: var(--color-fg-muted);
  }

  .btn-primary:disabled {
    background: var(--color-line-strong);
    border-color: var(--color-line-strong);
    color: var(--color-fg-dim);
    cursor: not-allowed;
  }

  .btn-ghost {
    background: transparent;
    color: var(--color-fg-muted);
    border-color: var(--color-line-strong);
    padding: var(--space-xs) var(--space-sm);
  }

  .btn-ghost:hover {
    color: var(--color-fg);
    border-color: var(--color-fg);
  }

  /* snackbar */
  .snackbar-region {
    position: fixed;
    left: 0;
    right: 0;
    bottom: var(--space-xl);
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 100;
  }

  .snackbar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: var(--space-md);
    max-width: 480px;
    width: calc(100% - var(--space-xl) * 2);
    background: var(--color-bg-card);
    border: 1px solid var(--color-line-strong);
    padding: var(--space-md) var(--space-md) var(--space-md) var(--space-lg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);

    opacity: 0;
    transform: translateY(8px);
    transition: opacity var(--motion-duration-base) var(--motion-easing-out-quart),
                transform var(--motion-duration-base) var(--motion-easing-out-quart);
  }

  .snackbar[data-open="true"] {
    opacity: 1;
    transform: translateY(0);
  }

  .snackbar__icon {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--color-line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .snackbar__icon svg {
    width: 11px;
    height: 11px;
    display: block;
  }

  .snackbar__body {
    flex: 1 1 auto;
    min-width: 0;
  }

  .snackbar__message {
    font-size: var(--type-body);
    color: var(--color-fg);
    margin: 0;
  }

  .snackbar__actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--space-sm);
  }

  .snackbar__undo {
    background: none;
    border: none;
    padding: var(--space-xs) var(--space-sm);
    font-family: inherit;
    font-size: var(--type-body);
    font-weight: 500;
    color: var(--color-accent);
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: opacity var(--motion-duration-fast) var(--motion-easing-out-quart);
  }

  .snackbar__undo:hover {
    opacity: 0.75;
  }

  .snackbar__undo:focus-visible,
  .snackbar__dismiss:focus-visible {
    outline: 1px solid var(--color-fg);
    outline-offset: 2px;
  }

  .snackbar__dismiss {
    background: none;
    border: none;
    padding: var(--space-xs);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-fg-dim);
    cursor: pointer;
    transition: color var(--motion-duration-fast) var(--motion-easing-out-quart);
  }

  .snackbar__dismiss:hover {
    color: var(--color-fg);
  }

  .snackbar__dismiss svg {
    width: 12px;
    height: 12px;
  }

  /* hairline auto-dismiss progress — structural, not decorative: it's the
     literal remaining-time affordance for the undo window */
  .snackbar__progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 100%;
    background: var(--color-line);
  }

  .snackbar__progress-fill {
    height: 100%;
    width: 100%;
    background: var(--color-fg-dim);
    transform-origin: left center;
    transform: scaleX(1);
  }

  .snackbar__progress-fill[data-running="true"] {
    transition: transform linear;
  }

  @media (prefers-reduced-motion: reduce) {
    .snackbar,
    .btn,
    .snackbar__undo,
    .snackbar__dismiss {
      transition-duration: 0.001ms !important;
    }
    .snackbar__progress-fill[data-running="true"] {
      transition-duration: 0.001ms !important;
    }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<div class="page-head">
  <p class="label">Component</p>
  <h1>Optimistic save — snackbar</h1>
  <p>
    The change applies immediately. A snackbar confirms it, offers Undo for a
    few seconds, then dismisses on its own — or close it early.
  </p>
</div>

<hr class="rule" />

<div class="demo">
  <div class="demo__row">
    <div class="demo__field">
      <span class="k">Document status</span>
      <span class="v" id="statusValue">Draft</span>
    </div>
    <div class="demo__field">
      <span class="k">Last change</span>
      <span class="v" id="lastChangeValue">—</span>
    </div>
  </div>
  <div class="demo__actions">
    <button class="btn btn-primary" id="saveBtn" type="button">Save change</button>
    <span class="demo__hint">Applies the change now, then confirms below.</span>
  </div>
</div>

<div class="snackbar-region" id="snackbarRegion" aria-live="polite" role="status">
  <div class="snackbar" id="snackbar" data-open="false">
    <span class="snackbar__icon" aria-hidden="true">
      <svg viewBox="0 0 12 12" fill="none">
        <path d="M2 6.2L4.6 9L10 2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-fg-muted)"/>
      </svg>
    </span>
    <div class="snackbar__body">
      <p class="snackbar__message" id="snackbarMessage">Change saved</p>
    </div>
    <div class="snackbar__actions">
      <button class="snackbar__undo" id="undoBtn" type="button">Undo</button>
      <button class="snackbar__dismiss" id="dismissBtn" type="button" aria-label="Dismiss">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <span class="snackbar__progress" aria-hidden="true">
      <span class="snackbar__progress-fill" id="progressFill" data-running="false"></span>
    </span>
  </div>
</div>

<script>
  (function () {
    var AUTO_DISMISS_MS = 6000;

    var saveBtn = document.getElementById('saveBtn');
    var statusValue = document.getElementById('statusValue');
    var lastChangeValue = document.getElementById('lastChangeValue');

    var snackbar = document.getElementById('snackbar');
    var snackbarMessage = document.getElementById('snackbarMessage');
    var undoBtn = document.getElementById('undoBtn');
    var dismissBtn = document.getElementById('dismissBtn');
    var progressFill = document.getElementById('progressFill');

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var dismissTimer = null;
    var previousStatus = null;
    var pending = false;

    function formatTime() {
      var d = new Date();
      var hh = d.getHours() % 12 || 12;
      var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
      var ss = (d.getSeconds() < 10 ? '0' : '') + d.getSeconds();
      return hh + ':' + mm + ':' + ss;
    }

    function clearDismissTimer() {
      if (dismissTimer) {
        clearTimeout(dismissTimer);
        dismissTimer = null;
      }
    }

    function hideSnackbar() {
      clearDismissTimer();
      snackbar.setAttribute('data-open', 'false');
      progressFill.setAttribute('data-running', 'false');
      pending = false;
    }

    function commitSave() {
      // the optimistic change is already applied; committing just clears
      // the undo window without altering visible state
      pending = false;
      previousStatus = null;
    }

    function startProgress() {
      progressFill.setAttribute('data-running', 'false');
      progressFill.style.transition = 'none';
      progressFill.style.transform = 'scaleX(1)';

      if (reduceMotion) {
        // still auto-dismisses on schedule; the bar just doesn't animate
        return;
      }

      // force reflow so the transition below actually runs
      // eslint-disable-next-line no-unused-expressions
      progressFill.offsetHeight;

      progressFill.setAttribute('data-running', 'true');
      progressFill.style.transition = 'transform ' + AUTO_DISMISS_MS + 'ms linear';
      progressFill.style.transform = 'scaleX(0)';
    }

    function showSnackbar(message) {
      clearDismissTimer();
      snackbarMessage.textContent = message;
      snackbar.setAttribute('data-open', 'true');
      startProgress();

      dismissTimer = setTimeout(function () {
        commitSave();
        hideSnackbar();
      }, AUTO_DISMISS_MS);
    }

    saveBtn.addEventListener('click', function () {
      // optimistic write: apply immediately, before any confirmation exists
      previousStatus = statusValue.textContent;
      statusValue.textContent = 'Published';
      statusValue.classList.remove('is-pending');
      lastChangeValue.textContent = formatTime();
      pending = true;

      showSnackbar('Change saved');
    });

    undoBtn.addEventListener('click', function () {
      if (!pending || previousStatus === null) {
        hideSnackbar();
        return;
      }
      statusValue.textContent = previousStatus;
      lastChangeValue.textContent = 'Reverted at ' + formatTime();
      previousStatus = null;
      pending = false;
      hideSnackbar();
    });

    dismissBtn.addEventListener('click', function () {
      // explicit dismiss commits the change silently — it does not undo it
      commitSave();
      hideSnackbar();
    });
  })();
</script>
