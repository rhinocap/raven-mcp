<!doctype html><html><head><meta charset="utf-8"><title>clean fixture</title>
<style>
  :root {
    --color-bg:#050505; --color-bg-elev:#141414; --color-fg:#f2f0ed; --color-fg-muted:#9a9793;
    --color-line:#2a2a2a; --color-accent:#ed4609;
    --type-label:13px; --type-body:16px; --type-lead:20px;
    --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px;
    --motion-duration-fast:120ms; --motion-duration-base:200ms;
    --motion-easing-out-quart:cubic-bezier(.25,1,.5,1);
  }
  body { background:var(--color-bg); color:var(--color-fg); margin:0; padding:var(--space-lg); }
  #save { min-width:44px; min-height:44px; padding:var(--space-sm) var(--space-md);
          background:var(--color-bg-elev); color:var(--color-fg); border:1px solid var(--color-line); }
  #save:hover { border-color:var(--color-fg-muted); }
  .bar { position:fixed; bottom:var(--space-lg); left:var(--space-lg);
         background:var(--color-bg-elev); border:1px solid var(--color-line);
         padding:var(--space-md); display:flex; gap:var(--space-md); align-items:center;
         transition: opacity var(--motion-duration-base) var(--motion-easing-out-quart); }
  .msg { font-size:var(--type-body); color:var(--color-fg); }
  .undo { font-size:var(--type-body); color:var(--color-accent); background:none;
          border:none; min-width:44px; min-height:44px; }
  .undo:hover { color:var(--color-fg); }
  @media (prefers-reduced-motion: reduce) { .bar { transition-duration: 1ms; } }
</style></head><body>
<button id="save">Save change</button>
<script>
  document.getElementById('save').onclick = () => {
    const d = document.createElement('div'); d.className='bar';
    d.innerHTML = '<span class="msg">Saved</span><button class="undo">Undo</button>';
    document.body.appendChild(d);
  };
</script></body></html>
