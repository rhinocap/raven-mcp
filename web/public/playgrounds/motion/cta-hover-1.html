/* Layout: the Raven Grab panel pattern. The animation fills the window; a floating panel on the left holds the
   controls, one on the right holds Send to agent, and a floating dock between them holds playback and the timeline.
   Both panels stay open; one column on phones. Tokens, sizes and states follow raven-grab.js. */
:root {
  --bg: #1a1a22;
  --panel: #212129;
  --raised: #2a2a33;

html, body { height: 100%; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Where the stage and dock sit: between the two panels. */
.app { --l: calc(var(--edge) + var(--panel-left-w) + var(--gap)); --rt: calc(var(--edge) + var(--panel-w) + var(--gap)); height: 100%; }

aside#send-panel { right: var(--edge); }

.fp-head h1, .fp-head h2 { flex: 1; min-width: 0; margin: 0; font-size: var(--t-lg); font-weight: 500; line-height: 1.3; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs { flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); min-height: var(--hit); background: rgba(255, 255, 255, .01); border-bottom: 1px solid var(--line); }
.tabs button { min-height: var(--hit); padding: 12px 6px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: var(--fg); cursor: pointer; font-size: var(--t-xs); line-height: 1; }

.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: rgba(0, 191, 255, .3); font-weight: 500; }

.btn.primary:hover { background: var(--accent-hover); transform: translateY(-2px); }

.group { display: flex; flex-direction: column; }
.group h2 { margin: 0 0 4px; color: var(--fg-3); font-size: var(--t-sm); font-weight: 500; letter-spacing: -.01em; }

.ctl:last-child { border-bottom: 0; }

.ctl label.name, .ctl span.name { color: var(--fg); font-size: var(--t-sm); min-width: 0; }

:root:not([data-input="key"]) .ctl:hover .help, :root[data-input="key"] .ctl:focus-within .help { visibility: visible; transition: visibility 0s linear .3s; }
.num { display: flex; align-items: center; height: var(--hit); cursor: text; }

.num input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 191, 255, .15); }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: var(--hit); background: transparent; margin: -8px 0 -4px; cursor: pointer; --p: 50%; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), rgba(255, 255, 255, .16) var(--p)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), rgba(255, 255, 255, .16) var(--p)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--fg); border: 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 0; }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--focus); }

/* Choices: Grab's segmented settings control. */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; margin-bottom: 6px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: var(--r); }
.seg button { min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); cursor: pointer; font-size: var(--t-sm); font-weight: 500; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .1); color: var(--fg); }
.swatches { position: relative; display: flex; gap: 2px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.swatches button, .swatches label { width: var(--hit); height: var(--hit); display: grid; place-items: center; background: transparent; border: 0; border-radius: var(--r); cursor: pointer; padding: 0; }
.swatches button:hover, .swatches label:hover { background: rgba(255, 255, 255, .05); }
.swatches i { display: block; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.swatches button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
.swatches label { color: var(--fg-2); }
.swatches label svg { width: 18px; height: 18px; }
.swatches input[type="color"] { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.swatches code { color: var(--fg-3); font-size: var(--t-xs); margin-left: 6px; font-family: inherit; font-variant-numeric: tabular-nums; }

.block { display: flex; flex-direction: column; gap: 8px; }

.block p { margin: 0; color: var(--fg-2); font-size: var(--t-sm); }
.block textarea { width: 100%; min-height: 88px; height: 120px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--fg-2); outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }

.block textarea::placeholder { color: var(--fg-3); }
.block .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.block label.ask { color: var(--fg-3); font-size: var(--t-sm); font-weight: 500; letter-spacing: -.01em; }
.block textarea.note { height: 88px; font-family: inherit; font-size: var(--t-sm); color: var(--fg); }
.block .context { color: var(--fg-3); }

.block .send-result { margin: 0; color: var(--fg-2); font-size: var(--t-sm); }
.block .send-result.ok { color: var(--accent); }
.menu-stack { display: flex; flex-direction: column; gap: 20px; }
/* The direct exports sit behind a disclosure styled as a button, with no marker glyph. */
.more-code { border-top: 1px solid var(--hair); padding-top: 16px; }
.more-code summary { list-style: none; display: inline-flex; align-items: center; }
.more-code summary::-webkit-details-marker { display: none; }
.more-code[open] summary { margin-bottom: 16px; }
.more-code .when-open, .more-code[open] .when-closed { display: none; }
.more-code[open] .when-open { display: inline; }
/* The right panel: what goes with a send scrolls; the note and Send stay pinned at the foot. */
#view-agent { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#view-agent > .view { flex: 1 1 auto; }
.fp-actions { flex: none; padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--hair); }

/* Curve control: Grab's curve editor. */
.curve-read { color: var(--fg-3); font-size: var(--t-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.curve-plot { display: block; width: 100%; height: auto; background: rgba(255, 255, 255, .03); border: 1px solid rgba(255, 255, 255, .1); border-radius: var(--r); margin-bottom: 6px; touch-action: none; }
.curve-plot .box { fill: none; stroke: rgba(255, 255, 255, .1); }

.curve-plot .handle:focus { outline: none; }

.curve-sub .name { color: var(--fg-3); }

/* The stage column: between the open panels, with the frame choice on top and the dock below. */
main#preview { position: fixed; top: var(--edge); bottom: var(--edge); left: var(--l); right: var(--rt); z-index: 1; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; color: var(--wall-ink); }
.viewbar { flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: var(--t-sm); }
.viewbar .seg { margin: 0; background: var(--panel); border-color: var(--line); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }

.strip-labels { display: flex; flex-direction: column; min-width: 0; padding-right: 12px; }

.lane { position: relative; overflow: hidden; }
.phase { position: absolute; top: 2px; bottom: 2px; display: flex; align-items: center; padding: 0 6px; border-left: 1px solid var(--line); color: var(--fg-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.phase:first-child { border-left-color: transparent; }

      const w = `track ${i + 1} (${tr.target} ${tr.property})`
      const prop = PROPS[tr.property] || { kind: 'number' }
      const valueDest = prop.kind === 'color' ? 'color' : prop.range ? `range:${prop.range[0]}:${prop.range[1]}` : 'number'
      for (const k of ['from', 'to']) {
        const v = tr[k]
        if (prop.kind === 'clip' && v && typeof v === 'object' && !isBind(v)) for (const e of ['top', 'right', 'bottom', 'left']) add(v[e], 'range:0:1', `${w} ${k} ${e}`)
        else add(v, valueDest, `${w} ${k}`)
      }
      if (tr.duration !== 'phase') add(tr.duration, 'time', `${w} duration`)
      add(tr.delay, 'time', `${w} delay`)
      add(tr.stagger?.each, 'time', `${w} stagger`)
      if (isBind(tr.easing)) add(tr.easing, 'easing', `${w} easing`)
      else if (tr.easing && tr.easing.spring) {
        add(tr.easing.spring.duration, 'spring-duration', `${w} spring duration`)
        add(tr.easing.spring.bounce, 'bounce', `${w} bounce`)
      }
    }
    return out
  }

  // The timeline with every binding replaced by its value and no controls left (no groups, params, presets or
  // constraints): the "timeline JSON" export. It compiles to the same plan as doc with values.
  function resolveTimeline(doc, values) {
    const params = paramMap(doc)
    const valueOf = (id) => (values && Object.prototype.hasOwnProperty.call(values, id) ? values[id] : params.get(id).default)
    const fix = (v) => {
      if (isBind(v)) {
        const x = valueOf(v.param)
        if (typeof x === 'number') return x * (v.times ?? 1) + (v.plus ?? 0)
        if (x && x.kind === 'bezier') return { cubicBezier: x.points.slice() }
        if (x && x.kind === 'spring') return { spring: { duration: x.duration, bounce: x.bounce } }
        return x
      }
      if (Array.isArray(v)) return v.map(fix)
      if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) o[k] = fix(v[k]); return o }
      return v
    }
    const out = {}
    for (const k of Object.keys(doc)) if (!['groups', 'params', 'presets', 'constraints'].includes(k)) out[k] = fix(doc[k])
    return out
  }

  // ---------- stagger ranks ----------
  function ranksFor(order, n, perm) {
    const r = new Array(n)
    if (order === 'reverse') for (let i = 0; i < n; i++) r[i] = n - 1 - i
    else if (order === 'center') {
      const c = (n - 1) / 2
      let min = Infinity
      for (let i = 0; i < n; i++) min = Math.min(min, Math.abs(i - c))
      for (let i = 0; i < n; i++) r[i] = Math.abs(i - c) - min
    } else if (order === 'random') for (let k = 0; k < n; k++) r[perm[k]] = k
    else for (let i = 0; i < n; i++) r[i] = i
    return r
  }
  function randomPerms(doc, partCount) {
    const ids = Object.keys(doc.targets).sort((a, b) => (a < b ? -1 : a > b ? 1 : 0))
    const rnd = mulberry32(doc.seed || 0)
    const perms = {}
    for (const id of ids) {
      if (!(doc.tracks || []).some((t) => t.target === id && t.stagger && t.stagger.order === 'random')) continue
      const n = partCount(id)
      const a = Array.from({ length: n }, (_, i) => i)
      for (let i = n - 1; i >= 1; i--) { const j = Math.floor(rnd() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x }
      perms[id] = a
    }
    return perms
  }

  // ---------- compile ----------
  // layout: { targets: { id: { parts: n } } } from the outliner (text) or 1 part (surface).
  function compile(doc, layout, values) {
    const R = makeResolver(doc, values)
    const warnings = []
    const targets = doc.targets || {}
    for (const [id, t] of Object.entries(targets)) {
      if ((t.kind === 'svg' || t.kind === 'element') && !(layout && layout.targets && layout.targets[id] && layout.targets[id].node)) {
        throw new TimelineError('no-node', `target "${id}" names ${t.kind === 'svg' ? 'artwork group' : 'fragment element'} "${t.id}", which the ${t.kind === 'svg' ? 'artwork' : 'fragment'} does not have`, { target: id })
      }
      if (t.kind === 'surface' && (t.role || 'stage') !== 'stage') throw new TimelineError('phase3', `target "${id}" is a ${t.role} surface; page transitions arrive in phase 3`, { target: id })
    }
    const trigger = triggerOf(doc)
    if (trigger.on === 'hover' && trigger.target) {
      const tg = targets[trigger.target]
      if (!tg) throw new TimelineError('trigger', `the hover trigger names "${trigger.target}", which is not a target`, { target: trigger.target })
      if (tg.kind !== 'element') throw new TimelineError('trigger', `the hover trigger names "${tg.label || trigger.target}", a ${tg.kind} target; hover needs a page element, or no target to use the whole stage`, { target: trigger.target })
    }
    const partCount = (id) => (targets[id] && targets[id].kind !== 'surface' ? (layout?.targets?.[id]?.parts ?? 1) : 1)
    const perms = randomPerms(doc, partCount)

    const tracks = (doc.tracks || []).map((tr, i) => {
      const where = `track ${i + 1} (${tr.target} ${tr.property})`
      const target = targets[tr.target]
      if (!target) throw new TimelineError('unknown-target', `${where}: no target "${tr.target}"`, { track: i })
      const prop = PROPS[tr.property]
      if (!prop || !(KIND_PROPS[target.kind] || []).includes(tr.property)) {
        const later = ['fill', 'stroke', 'draw'].includes(tr.property)
        throw new TimelineError('property', `${where}: ${tr.property} does not apply to a ${target.kind} target${later ? ' (svg paint and draw are not built yet)' : ''}`, { track: i })
      }
      const n = partCount(tr.target)
      const each = tr.stagger ? R.num(tr.stagger.each, where + ' stagger') : 0
      if (tr.stagger && !isSplit(target)) throw new TimelineError('stagger', `${where}: stagger needs a split target (text split into letters, words or lines, or an element or svg target split into its children)`, { track: i })
      if (!(Number.isFinite(each) && each >= 0 && each <= MAX_MS)) throw new TimelineError('time', `${where}: stagger must be 0 to ${MAX_MS} ms`, { track: i })
      const ranks = ranksFor(tr.stagger?.order || 'forward', n, perms[tr.target])
      const delay = tr.delay === undefined ? 0 : R.num(tr.delay, where + ' delay')
      if (!(Number.isFinite(delay) && delay >= 0 && delay <= MAX_MS)) throw new TimelineError('time', `${where}: delay must be 0 to ${MAX_MS} ms`, { track: i })
      const dur = tr.duration === 'phase' ? 'phase' : R.num(tr.duration, where + ' duration')
      if (dur !== 'phase' && !(Number.isFinite(dur) && dur >= 0 && dur <= MAX_MS)) throw new TimelineError('time', `${where}: duration must be 0 to ${MAX_MS} ms`, { track: i })
      if (dur === 'phase' && tr.stagger) throw new TimelineError('phase-stagger', `${where}: a track that runs to its section's end cannot have a stagger`, { track: i })
      const easing = R.easing(tr.easing, where)
      const val = (v, k) => {
        if (v === undefined) return undefined
        if (prop.kind === 'color') return hexToRgb(R.color(v, `${where} ${k}`))
        if (prop.kind === 'clip') {
          if (isBind(v) || typeof v !== 'object') throw new TimelineError('bind-type', `${where} ${k}: clip needs top, right, bottom and left`, { track: i })
          return ['top', 'right', 'bottom', 'left'].map((e) => R.num(v[e], `${where} ${k} ${e}`))
        }
        const x = R.num(v, `${where} ${k}`)
        if (!Number.isFinite(x)) throw new TimelineError('value', `${where} ${k}: not a finite number`, { track: i })
        return prop.channels.map(() => x)
      }
      const maxRank = n ? Math.max(...ranks) : 0
      return { i, tr, where, target: tr.target, prop, n, ranks, maxRank, each, delay, dur, easing, from: val(tr.from, 'from'), to: val(tr.to, 'to') }
    })

    // Phases: fixed lengths, then auto lengths from their explicit-duration tracks.
    const phaseIds = new Set()
    const phases = (doc.phases || []).map((ph) => {
      if (phaseIds.has(ph.id)) throw new TimelineError('phase', `section "${ph.label}" is declared twice`, { phase: ph.id })
      phaseIds.add(ph.id)
      const fixed = ph.duration !== 'auto'
      let len
      if (fixed) {
        len = R.num(ph.duration, `${ph.label} length`)
        if (!(Number.isFinite(len) && len >= 0 && len <= MAX_MS)) throw new TimelineError('time', `${ph.label} must be 0 to ${MAX_MS} ms long`, { phase: ph.id })
      } else {
        const own = tracks.filter((t) => t.tr.phase === ph.id && t.dur !== 'phase')
        if (!own.length) throw new TimelineError('auto-empty', `"${ph.label}" fits its length to its tracks but none has a set duration`, { phase: ph.id })
        len = Math.max(...own.map((t) => t.delay + t.dur + t.each * t.maxRank))
        if (len > MAX_MS) throw new TimelineError('time', `"${ph.label}" would run ${Math.round(len)} ms; at most ${MAX_MS}`, { phase: ph.id })
      }
      return { id: ph.id, label: ph.label, fixed, len, bind: ph.duration }
    })
    let t = 0
    for (const ph of phases) { ph.start = t; t += ph.len; ph.end = t }
    const total = t
    if (total > MAX_MS) throw new TimelineError('time', `the timeline runs ${Math.round(total)} ms; at most ${MAX_MS}`, {})
    if (!(total > 0)) throw new TimelineError('time', 'the timeline has no length', {})
    const phaseById = new Map(phases.map((p) => [p.id, p]))
    // Reduced motion shows the frame at the end of restPhase (default: the final frame).
    if (doc.restPhase !== undefined && !phaseById.has(doc.restPhase)) throw new TimelineError('unknown-phase', `the reduced-motion frame names no section "${doc.restPhase}"`, {})
    const restTime = doc.restPhase !== undefined ? phaseById.get(doc.restPhase).end : total

    // Segments per channel. A channel key is target/part/channel.
    const channels = new Map()
    const chan = (target, part, name) => {
      const key = `${target}/${part}/${name}`
      let c = channels.get(key)
      if (!c) { c = { key, target, part, name, limit: CHANNEL[name].limit, clamp: CHANNEL[name].clamp, color: !!CHANNEL[name].color, base: baseValue(doc, R, target, name), raw: [] }; channels.set(key, c) }
      return c
    }
    const stripTracks = []
    for (const k of tracks) {
      const ph = phaseById.get(k.tr.phase)
      if (!ph) throw new TimelineError('unknown-phase', `${k.where}: no section "${k.tr.phase}"`, { track: k.i })
      if (k.delay >= ph.len) {
        const dl = labelOf(doc, k.tr.delay, 'A delay')
        throw new TimelineError('delay-past-phase', `${dl} can't be as long as the ${ph.label} section (${Math.round(k.delay)} ms of ${Math.round(ph.len)} ms)`, { track: k.i, phase: ph.id })
      }
      const parts = []
      for (let p = 0; p < k.n; p++) {
        const start = ph.start + k.delay + k.ranks[p] * k.each
        const D = k.dur === 'phase' ? ph.end - start : k.dur
        const nominalEnd = start + D
        if (nominalEnd > MAX_MS) throw new TimelineError('time', `${k.where}: ends at ${Math.round(nominalEnd)} ms; at most ${MAX_MS}`, { track: k.i })
        let t0 = start, t1 = nominalEnd, cut = false
        if (ph.fixed && nominalEnd > ph.end + EPS_T) { cut = true; t1 = ph.end; if (t0 > ph.end) t0 = ph.end }
        parts.push({ part: p, start, t0, t1, nominalEnd, cut })
        for (const [ci, name] of k.prop.channels.entries()) {
          chan(k.target, p, name).raw.push({ track: k.i, t0, t1, D, easing: k.easing, from: k.from ? k.from[ci] : undefined, to: k.to[ci], cut })
        }
      }
      const cutParts = parts.filter((x) => x.cut)
      if (cutParts.length) {
        const late = cutParts.filter((x) => x.t0 >= ph.end).length
        warnings.push({ code: 'cut', track: k.i, phase: ph.id, message: `${k.where} runs past the end of ${ph.label}${k.n > 1 ? ` for ${cutParts.length} of ${k.n} parts` : ''}; it stops there${late ? ` (${late} never start)` : ''}` })
      }
      stripTracks.push({ index: k.i, target: k.target, property: k.tr.property, phase: ph.id, parts })
    }

    // Walk each channel in time order: start values, velocity hand-off, overlap.
    for (const c of channels.values()) {
      c.segs = c.raw.sort((a, b) => a.t0 - b.t0 || (a.t1 - a.t0) - (b.t1 - b.t0))
      delete c.raw
      let cur = c.base, vel = 0, endT = -Infinity, infinite = false, prevTrack = -1
      for (let i = 0; i < c.segs.length; i++) {
        const s = c.segs[i]
        const prev = c.segs[i - 1]
        if (prev && (s.t0 < prev.t1 - EPS_T || (s.t1 === s.t0 && prev.t1 === prev.t0 && Math.abs(s.t0 - prev.t0) <= EPS_T))) {
          throw new TimelineError('overlap', `track ${prev.track + 1} and track ${s.track + 1} both move ${c.target} ${c.name} at ${Math.round(s.t0)} ms`, { tracks: [prev.track, s.track], target: c.target })
        }
        const joins = Math.abs(s.t0 - endT) <= EPS_T
        if (s.from !== undefined) { s.sv = s.from; s.v0 = 0 }
        else {
          if (!Number.isFinite(cur)) throw new TimelineError('no-start', `track ${s.track + 1} moves ${c.target} background but ${c.target} has none to start from; give the track a starting value, or set a background on it in styles`, { track: s.track, target: c.target })
          s.sv = cur
          s.v0 = 0
          if (s.easing.type === 'spring' && joins) {
            if (infinite) throw new TimelineError('infinite-slope', `track ${s.track + 1} starts a spring from track ${prevTrack + 1}, which ends infinitely steep; give it a starting value`, { track: s.track })
            s.v0 = vel
          }
        }
        if (s.easing.type === 'spring') s.spring = springCoef(s.easing.duration / 1000, s.easing.bounce, s.sv - s.to, s.v0)
        const end = segEnd(s)
        s.ev = end.v; s.evel = end.vel; s.inf = end.inf
        cur = end.v; vel = end.vel; infinite = end.inf; endT = s.t1; prevTrack = s.track
      }
    }

    // Bases for channels with no track, so evaluate() can fill every property.
    const bases = new Map()
    const baseOf = (target, name) => {
      const key = `${target}/${name}`
      if (!bases.has(key)) bases.set(key, baseValue(doc, R, target, name))
      return bases.get(key)
    }
    // Two targets on one element may not move the same property: the page could show only one of them.
    const owner = new Map()
    for (const c of channels.values()) {
      const lt = layout && layout.targets && layout.targets[c.target]
      if (!lt || !lt.paths) continue
      const at = lt.paths[c.part]
      const group = PROP_GROUP[c.name] || c.name
      const key = at + '|' + group
      const prev = owner.get(key)
      if (prev && prev.target !== c.target) throw new TimelineError('overlap', `"${targets[prev.target].label || prev.target}" and "${targets[c.target].label || c.target}" both move the ${group} of the same element; move it in one of them`, { targets: [prev.target, c.target] })
      owner.set(key, c)
    }
    return { doc, layout, total, restTime, phases, channels: [...channels.values()], byKey: channels, tracks: stripTracks, warnings, baseOf, resolve: R, trigger }
  }

  // ---------- triggers ----------
  // "load", or { on: "hover", target?, leave? } or { on: "scroll", threshold?, once? }, with defaults filled in.
  function triggerOf(doc) {
    const tr = doc.trigger
    if (tr === undefined || tr === null || tr === 'load') return { on: 'load' }
    if (tr.on === 'hover') return { on: 'hover', target: tr.target || null, leave: tr.leave || 'reverse' }
    if (tr.on === 'scroll') return { on: 'scroll', threshold: tr.threshold ?? 0.25, once: tr.once ?? true }
    throw new TimelineError('trigger', `trigger "${typeof tr === 'string' ? tr : tr.on}" is not load, hover or scroll`, {})
  }
  // Timeline time at clock time \`now\` after events [{ at, type }] (type: enter, leave for hover; in, out for scroll),
  // in clock milliseconds. The playground and both web exports follow this; the trigger tests check them against it.
  // hover: enter plays forward from the current time; leave plays back to 0 at the same speed ("reverse") or
  // changes nothing ("finish"). scroll: in plays forward; with once false, out rewinds to 0 and the next in plays again.
  function triggerClock(trigger, total, events, now) {
    let t = 0, rate = trigger.on === 'load' ? 1 : 0, since = 0, fired = false
    const advance = (at) => {
      t = Math.min(total, Math.max(0, t + (at - since) * rate))
      since = at
      if ((rate > 0 && t >= total) || (rate < 0 && t <= 0)) rate = 0
    }
    for (const e of events) {
      advance(e.at)
      if (trigger.on === 'hover') {
        if (e.type === 'enter') rate = t < total ? 1 : 0
        else if (e.type === 'leave' && trigger.leave === 'reverse') rate = t > 0 ? -1 : 0
      } else if (trigger.on === 'scroll') {
        if (e.type === 'in' && !fired) { fired = true; rate = t < total ? 1 : 0 }
        else if (e.type === 'out' && fired && !trigger.once) { fired = false; t = 0; rate = 0 }
      }
    }
    advance(now)
    return t
  }

  const PROP_GROUP = { opacity: 'opacity', tx: 'position', ty: 'position', sx: 'scale', sy: 'scale', r: 'rotation', blur: 'blur', br: 'background', bg: 'background', bb: 'background', clipT: 'clip', clipR: 'clip', clipB: 'clip', clipL: 'clip' }
  function baseValue(doc, R, target, name) {
    const ci = ['cr', 'cg', 'cb'].indexOf(name)
    if (ci >= 0) return hexToRgb(R.color(doc.targets[target].color, `${target} colour`))[ci]
    const bi = ['br', 'bg', 'bb'].indexOf(name)
    if (bi >= 0 && doc.targets[target].kind === 'element') {
      // A split target's parts are its children, each with its own style, so they share no starting background.
      if ((doc.targets[target].split || 'none') !== 'none') return NaN
      const own = doc.styles && doc.styles[doc.targets[target].id] && doc.styles[doc.targets[target].id].background
      if (!own) return NaN
      return hexToRgb(R.color(own, `${target} background`))[bi]
    }
    if (bi >= 0) return hexToRgb(R.color(doc.stage.background, 'stage background'))[bi]
    return CHANNEL[name].base
  }

  // Value and velocity (units per second) where a segment stops: its nominal end, or its cut.
  function segEnd(s) {
    const tau = s.t1 - s.t0
    if (s.D === 0) return { v: s.to, vel: 0, inf: false }
    if (s.easing.type === 'spring') return { v: s.to + springY(s.spring, tau / 1000), vel: springV(s.spring, tau / 1000), inf: false }
    const x = tau / s.D
    const sp = bezierS(s.easing.p, x)
    const slope = bezierSlope(s.easing.p, sp)
    const delta = s.to - s.sv
    const v = s.sv + delta * bx(sp, s.easing.p[1], s.easing.p[3])
    if (!Number.isFinite(slope)) return { v, vel: delta === 0 ? 0 : Infinity, inf: delta !== 0 }
    return { v, vel: delta / (s.D / 1000) * slope, inf: false }
  }
  function segValue(s, t) {
    if (t >= s.t1) return s.ev
    const tau = t - s.t0
    if (tau <= 0) return s.D === 0 ? s.to : s.sv
    if (s.easing.type === 'spring') return s.to + springY(s.spring, tau / 1000)
    return s.sv + (s.to - s.sv) * bezierY(s.easing.p, tau / s.D)
  }
  function segVelocity(s, t) {
    if (t >= s.t1 || s.D === 0) return 0
    const tau = Math.max(0, t - s.t0)
    if (s.easing.type === 'spring') return springV(s.spring, tau / 1000)
    const sp = bezierS(s.easing.p, tau / s.D)
    const slope = bezierSlope(s.easing.p, sp)
    return (s.to - s.sv) / (s.D / 1000) * slope
  }
  // side 'R' is the value at t (a track starting at t owns it); 'L' is the limit from the left.
  function findSeg(c, t, side) {
    const segs = c.segs
    let lo = 0, hi = segs.length - 1, idx = -1
    while (lo <= hi) {
      const mid = (lo + hi) >> 1
      if (side === 'L' ? segs[mid].t0 < t : segs[mid].t0 <= t) { idx = mid; lo = mid + 1 } else hi = mid - 1
    }
    return idx
  }
  function channelValue(c, t, side) {
    if (!c.segs.length) return c.base
    const i = findSeg(c, t, side || 'R')
    if (i < 0) return c.segs[0].sv
    return segValue(c.segs[i], t)
  }
  function channelVelocity(c, t) {
    if (!c.segs.length) return 0
    const i = findSeg(c, t, 'R')
    return i < 0 ? 0 : segVelocity(c.segs[i], t)
  }
  const clampTo = (v, r) => (r ? Math.min(r[1], Math.max(r[0], v)) : v)

  // ---------- evaluate ----------
  // Drawn values per target part: clamped, clip normalised. Unclamped values stay inside the plan.
  function partState(plan, target, part, t, side) {
    const get = (name) => {
      const c = plan.byKey.get(`${target}/${part}/${name}`)
      const v = c ? channelValue(c, t, side) : plan.baseOf(target, name)
      return clampTo(v, CHANNEL[name].clamp)
    }
    const kind = plan.doc.targets[target].kind
    if (kind === 'surface') return { background: [get('br'), get('bg'), get('bb')] }
    const s = { opacity: get('opacity'), tx: get('tx'), ty: get('ty'), sx: get('sx'), sy: get('sy'), r: get('r'), blur: get('blur') }
    if (kind === 'text') s.color = [get('cr'), get('cg'), get('cb')]
    if (kind === 'element' && hasBackground(plan, target, part)) s.background = [get('br'), get('bg'), get('bb')]
    let ct = get('clipT'), cr = get('clipR'), cb = get('clipB'), cl = get('clipL')
    if (cl + cr > 1) { const k = 1 / (cl + cr); cl *= k; cr *= k }
    if (ct + cb > 1) { const k = 1 / (ct + cb); ct *= k; cb *= k }
    s.clip = [ct, cr, cb, cl]
    return s
  }
  // An element part has a background to write when a track moves it or its style sets one.
  function hasBackground(plan, target, part) {
    return plan.byKey.has(`${target}/${part}/br`) || Number.isFinite(plan.baseOf(target, 'br'))
  }
  function evaluate(plan, t, opts) {
    const side = (opts && opts.side) || 'R'
    const out = { t, targets: {} }
    for (const [id, tg] of Object.entries(plan.doc.targets)) {
      const n = tg.kind === 'surface' ? 1 : (plan.layout?.targets?.[id]?.parts ?? 1)
      const parts = []
      for (let p = 0; p < n; p++) parts.push(partState(plan, id, p, t, side))
      out.targets[id] = parts
    }
    if (opts && opts.velocities) {
      out.velocities = {}
      for (const c of plan.channels) out.velocities[c.key] = channelVelocity(c, t)
    }
    return out
  }

  // ---------- written values (shared by renderer and exports) ----------
  // CSS property groups per target kind, each a list of output quantities with their limits.
  function cssGroups(plan, target, part) {
    const tg = plan.doc.targets[target]
    if (tg.kind === 'surface') return [{ prop: 'background-color', names: ['br', 'bg', 'bb'], color: true }]
    if (tg.kind === 'element' || tg.kind === 'svg') {
      const g = [
        { prop: 'opacity', names: ['opacity'] },
        { prop: 'transform', names: ['tx', 'ty', 'r', 'sx', 'sy'] },
        { prop: 'filter', names: ['blur'] },
      ]
      if (tg.kind === 'element') {

  const fragPos = (plan) => (plan.doc.stage.fragmentPosition || [0, 0]).map((v, i) => plan.resolve.num(v, 'fragment position ' + i))

  // ---------- markup ----------
  const cls = (plan, id, p) => `ml-${plan.doc.id}-${id}-${p}`
  function surfaceId(plan) { return Object.keys(plan.doc.targets).find((id) => plan.doc.targets[id].kind === 'surface') }
  function hasClip(plan, id, p) { return ['clipT', 'clipR', 'clipB', 'clipL'].some((n) => plan.byKey.has(`${id}/${p}/${n}`)) }
  function markup(plan, geo, opts) {
    const W = plan.doc.stage.width, H = plan.doc.stage.height
    const root = `ml-${plan.doc.id}`
    const label = Object.values(geo).map((g) => g.label).join(' ')
    const defs = []
    const groups = []
    for (const [id, g] of Object.entries(geo)) {
      g.parts.forEach((p, i) => {
        const c = cls(plan, id, i)
        let clip = ''

          const b = p.box
          defs.push(`<clipPath id="${c}-clip" clipPathUnits="userSpaceOnUse"><rect class="${c}-clip" x="${r3(b.x)}" y="${r3(b.y)}" width="${r3(b.w)}" height="${r3(b.h)}"/></clipPath>`)

  }

  // ---------- written CSS values ----------
  // A part's static style at one time: every property, as the CSS and WAAPI exports write it.
  function writtenStyle(plan, id, p, st, box) {
    const out = {}
    for (const group of TL.cssGroups(plan, id, p)) {
      if (group.prop === 'clip') continue
      if (group.prop === 'clip-path' && !hasClip(plan, id, p)) continue
      if (group.prop === 'filter' && !plan.byKey.has(`${id}/${p}/blur`)) continue
      out[group.prop] = TL.formatCss(group, TL.writtenVector(group, st, box))

  }
  const cssDecl = (style) => Object.entries(style).map(([k, v]) => `${k}: ${v};`).join(' ')
  // Offsets carry 10 fraction digits (8 in percent), so a keyframe lands within 3 ns of its time at 60 s.
  const pct = (t, total) => { const s = (t / total * 100).toFixed(8).replace(/\.?0+$/, ''); return (s === '' ? '0' : s) + '%' }

  // ---------- CSS keyframes export ----------
  function cssExport(plan, geo) {
    const T = TL.round(plan.total, 3)
    const root = `ml-${plan.doc.id}`
    const W = plan.doc.stage.width, H = plan.doc.stage.height
    const sampled = TL.sampleExport(plan, boxesOf(geo), 'css')
    // Static styles are the reduced-motion frame; the animations play over them inside the media query.
    const end = TL.evaluate(plan, plan.restTime)
    const lines = []
    const motion = []
    const sid = surfaceId(plan)
    const bgGroup = sid && TL.cssGroups(plan, sid)[0]
    const bgEnd = sid ? TL.formatCss(bgGroup, TL.writtenVector(bgGroup, end.targets[sid][0])) : TL.rgbToHex(TL.hexToRgb(plan.resolve.color(plan.doc.stage.background, 'stage background')))
    if (hasFragment(plan)) {
      // Element stages keep the fragment's own layout, so they are written at their stage size, unscaled.
      const fp = fragPos(plan)
      lines.push(`.${root} { position: relative; width: ${W}px; height: ${H}px; background-color: ${bgEnd}; overflow: hidden; }`)
      lines.push(`.${root} svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }`)
      lines.push(`.${root}-box { position: absolute; left: 0; top: 0; width: ${W}px; height: ${H}px; }`)
      lines.push(`.${root}-frag { position: absolute; left: ${r3(fp[0])}px; top: ${r3(fp[1])}px; }`)
      lines.push(`.${root}-frag :where(h1, h2, h3, h4, h5, h6, p) { margin: 0; font-size: inherit; font-weight: inherit; }`)
      for (const [sel, d] of fragmentRules(plan)) lines.push(`${sel} { ${d.map(([k, v]) => `${k}: ${v};`).join(' ')} }`)

    }
    for (const [id, g] of Object.entries(geo)) {
      g.parts.forEach((part, i) => {
        const st = end.targets[id][i]
        const style = Object.assign({ 'transform-box': 'view-box', 'transform-origin': `${r3(part.origin[0])}px ${r3(part.origin[1])}px` }, writtenStyle(plan, id, i, st, part.box))
        lines.push(`.${cls(plan, id, i)} { ${cssDecl(style)} }`)
        if (hasClip(plan, id, i)) {
          const rr = TL.formatCss({ prop: 'clip' }, TL.writtenVector({ prop: 'clip' }, st, part.box))
          lines.push(`.${cls(plan, id, i)}-clip { x: ${rr.x}px; y: ${rr.y}px; width: ${rr.width}px; height: ${rr.height}px; }`)

    }
    // Animations by element.
    const byEl = new Map()
    // Targets can share an element (a card's children and its button). One element gets one animation list,
    // written on its first part class, or the later rule would replace the earlier one's animations.
    const shared = new Map(), first = new Map()

      if (s.constant) continue

      const el = s.group.prop === 'background-color' && !s.group.own ? `.${root}` : s.group.prop === 'clip' ? `${own}-clip` : (shared.get(own) || own)

        const v = TL.formatCss(s.group, f.w)

    // from the middle of an animation.

    if (trig.on === 'load') return { html: markup(plan, geo), css, sampled, snippet: `<style>\n${css}\n</style>\n${markup(plan, geo)}` }
    const js = `(() => {
  const root = document.querySelector('.${root}');
  const T = ${T};
${triggerControl(plan)}

  let stop = null;
  // The CSS animations wait paused at the start; reduced motion has none and shows the still frame.
  function setup() {

    return { html: markup(plan, geo), css, js, sampled, snippet: `<style>\n${css}\n</style>\n${markup(plan, geo)}\n<script>\n${js}\n<\/script>` }
  }

  // ---------- triggers ----------
  // control(anims) wires a hover or scroll trigger to a set of animations of length T, all paused at 0, and
  // returns a function that unwires it. It follows TL.triggerClock: enter plays forward from the current time,
  // leave plays back to 0 at the same speed (or, with "finish", changes nothing); scroll plays once the stage is
  // threshold in view, and with once false rewinds to 0 when fully out.
  function triggerControl(plan) {
    const trig = plan.trigger || TL.triggerOf(plan.doc)
    const head = `  function control(anims) {

      return `${head}

    const area = ${sel ? `root.querySelector(${JSON.stringify(sel)})` : 'root'};

    }

    // In view once ${trig.threshold} of the stage shows, or its visible height is ${trig.threshold} of the window's (tall stages).

  }

  // ---------- WAAPI export ----------
  function waapiExport(plan, geo) {
    const T = TL.round(plan.total, 3)

    const sampled = TL.sampleExport(plan, boxesOf(geo), 'waapi')

    const tracks = []

      const kf = s.frames.map((f) => {
        const v = TL.formatCss(s.group, f.w)

        if (s.group.prop === 'clip') Object.assign(o, { x: v.x + 'px', y: v.y + 'px', width: v.width + 'px', height: v.height + 'px' })

      })

    }
    const trig = plan.trigger || TL.triggerOf(plan.doc)
    const js = trig.on !== 'load' ? `(() => {
  const root = document.querySelector('.${root}');
  const T = ${T};
  const tracks = [
${tracks.join(',\n')}

${triggerControl(plan)}

  let anims = [], stop = null;

    stop = control(anims);

  preference.addEventListener('change', setup);
  root.mlCleanup = () => { teardown(); preference.removeEventListener('change', setup); };
})();` : `(() => {
  const root = document.querySelector('.${root}');
  const tracks = [
${tracks.join(',\n')}
  ];
  const preference = matchMedia('(prefers-reduced-motion: reduce)');
  let handles = [];

  function play() {
    handles = tracks.map(([sel, keyframes]) => (sel ? root.querySelector(sel) : root).animate(keyframes, { duration: ${T}, easing: 'linear', fill: 'both' }));

    return { html: markup(plan, geo), css, js, sampled, snippet: `<style>\n${css}\n</style>\n${markup(plan, geo)}\n<script>\n${js}\n<\/script>` }
  }

  // ---------- renderer ----------

  function mountRenderer(container, plan, geo) {
    const rootEl = container.querySelector(`.ml-${plan.doc.id}`)

    const parts = []
    let resize = null
    if (hasFragment(plan)) {
      const d = rootEl.ownerDocument
      const W = plan.doc.stage.width, H = plan.doc.stage.height, fp = fragPos(plan)

      // font (Untitled Sans) cannot replace the controls' type. Exports keep the page's family name.

      for (const e of layer.querySelectorAll('h1, h2, h3, h4, h5, h6, p')) { e.style.margin = '0'; e.style.fontSize = 'inherit'; e.style.fontWeight = 'inherit' }

      for (const [sel, decls] of fragmentRules(plan)) {

        if (e) for (const [k, v] of decls) e.style.setProperty(k, k === 'font-family' ? privateFamily(v) : v)
      }

      parts,
      destroy() { if (resize) resize.disconnect() },
      apply(t) {
        const st = TL.evaluate(plan, t)
        if (sid) { const g = TL.cssGroups(plan, sid)[0]; rootEl.style.backgroundColor = TL.formatCss(g, TL.writtenVector(g, st.targets[sid][0])) }
        else rootEl.style.backgroundColor = TL.rgbToHex(TL.hexToRgb(plan.resolve.color(plan.doc.stage.background, 'stage background')))
        for (const [id, list] of Object.entries(els)) {
          list.forEach((e, i) => {
            const s = st.targets[id][i]

            e.g.style.fill = w.fill

            if (e.clip) { const rr = TL.formatCss({ prop: 'clip' }, TL.writtenVector({ prop: 'clip' }, s, e.part.box)); e.clip.setAttribute('x', rr.x); e.clip.setAttribute('y', rr.y); e.clip.setAttribute('width', rr.width); e.clip.setAttribute('height', rr.height) }

          const w = writtenStyle(plan, ep.target, ep.part, st.targets[ep.target][ep.part], { x: 0, y: 0, w: 1, h: 1 })
          ep.e.style.opacity = w.opacity
          ep.e.style.transform = w.transform
          if (w.filter) ep.e.style.filter = w.filter
          if (w['background-color']) ep.e.style.backgroundColor = w['background-color']
          if (w['clip-path']) ep.e.style.clipPath = w['clip-path']

      },
    }
  }

  return { geometry, boxesOf, markup, cssExport, waapiExport, mountRenderer, writtenStyle, pathD, hasFragment, fragmentHtml, styleDecls, elementParts, hoverSelector }
})

<script>

// every part is a KeyframeTimeline built from the evaluator's segments, with each spring's start velocity

${parts.join(',\n')}

${tracks.join(',\n')}
