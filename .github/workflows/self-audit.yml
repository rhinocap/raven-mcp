name: Weekly self-audit

on:
  schedule:
    # Sundays 16:00 UTC — files issues before Monday's knowledge-PR run
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build Raven (needs dist/ for the MCP client to spawn)
        run: npm run build

      - name: Run self-audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.RAVEN_KNOWLEDGE_PR }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-audit.mjs
