name: Release

# Manual dispatch only. The Friday schedule was removed: an unattended run
# publishes to npm over OIDC without a human in the loop, and a single
# feat(...) commit is enough to make `auto` cut a minor nobody asked for.
# Run it from the Actions tab when a release is actually intended.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto | patch | minor | major)"
        required: false
        default: "auto"

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      bump: ${{ steps.release.outputs.bump }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail BEFORE the ~10-minute test gate rather than after it. `release.sh`
      # hard-exits when either of these is missing, and it does so AFTER npm ci,
      # Playwright and the full suite have already run. Both are checked here so
      # a misconfigured repo costs seconds, not a full green build that then dies
      # one line into the release script.
      - name: Preflight release credentials
        run: |
          missing=0
          if [ -z "${{ secrets.RAVEN_REGISTRY_KEY }}" ]; then
            echo "::error::secret RAVEN_REGISTRY_KEY is not set. The MCP Registry step (ai.ravenmcp/raven-mcp) cannot run without the ed25519 signing key for ravenmcp.ai domain auth."
            missing=1
          fi
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::secret VERCEL_TOKEN is not set. The apex .mcpb at ravenmcp.ai is served by the web Vercel project, which has NO git integration, so nothing else in this workflow can move it."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC trusted publishing requires 11.5.1+)
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium (tests render pages)
        run: npx playwright install --with-deps chromium

      - name: Run tests (release gate)
        env:
          RAVEN_NO_USAGE_LOG: "1"
        run: npm test

      # `release.sh` requires the mcp-publisher CLI on PATH and a signing key on
      # disk, and checks for BOTH in its opening guardrails. Neither was ever
      # provided here, so every CI release since the registry step landed
      # (2026-07-28) would have exited 1 before bumping anything. Pinned rather
      # than tracking latest: this is a publishing credential path, and a silent
      # CLI upgrade is not something a release should discover unattended.
      - name: Install mcp-publisher (MCP Registry CLI)
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          tar --extract --gzip --file /tmp/mcp-publisher.tar.gz --directory /tmp mcp-publisher
          sudo install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      # Written to the runner's ephemeral filesystem and pointed at by the same
      # env var release.sh already reads locally, so the script is byte-identical
      # in CI and on Andrew's machine. Registry auth is HTTP domain auth against
      # https://ravenmcp.ai/.well-known/mcp-registry-auth, which needs no
      # interactive step and therefore works unattended.
      - name: Provision MCP Registry signing key
        env:
          RAVEN_REGISTRY_KEY: ${{ secrets.RAVEN_REGISTRY_KEY }}
        run: |
          umask 077
          printf '%s' "$RAVEN_REGISTRY_KEY" > "$HOME/.raven-mcp-registry-key"
          echo "RAVEN_REGISTRY_KEY_FILE=$HOME/.raven-mcp-registry-key" >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config user.name "raven-bot"
          git config user.email "raven-bot@users.noreply.github.com"

      - name: Detect release scope
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: node scripts/detect-release-scope.mjs

      - name: Cut release
        if: steps.release.outputs.released == 'true'
        run: |
          bash scripts/release.sh "${{ steps.release.outputs.bump }}"

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${{ steps.release.outputs.notes }}" > /tmp/release-notes.md
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            site/raven.mcpb

      - name: Rebuild changelog page
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-changelog.mjs

      - name: Commit changelog + push
        if: steps.release.outputs.released == 'true'
        run: |
          git add site/changelog.html
          if ! git diff --cached --quiet; then
            git commit -m "Update changelog for v${{ steps.release.outputs.version }}"
            git push
          fi

      # THE FOURTH SURFACE. npm, the MCP Registry record and the git tag are all
      # handled by release.sh; the public download at https://ravenmcp.ai/raven.mcpb
      # is not, because the apex is served by the `web` Vercel project and `web`
      # has NO git integration - a push to main will never move it. It stayed one
      # release behind through a fully successful release.sh run (v2.5.0,
      # 2026-08-17) for exactly this reason. release.sh prints a reminder; a
      # workflow has nobody to read one, so the step lives here.
      - name: Deploy apex marketing site (publishes the new .mcpb)
        if: steps.release.outputs.released == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: web
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN"

      # Read the bytes back off the live apex rather than trusting the deploy's
      # own exit code: a green deploy of a stale tree is the exact failure this
      # step exists to catch. Compares the served bundle to the one just built.
      - name: Verify the apex .mcpb is the bundle we just built
        if: steps.release.outputs.released == 'true'
        run: |
          local_sha=$(sha256sum web/public/raven.mcpb | cut -d" " -f1)
          live_sha=""
          for i in 1 2 3 4 5 6; do
            live_sha=$(curl --fail --silent --show-error --location https://ravenmcp.ai/raven.mcpb | sha256sum | cut -d" " -f1)
            [ "$live_sha" = "$local_sha" ] && break
            echo "apex not yet serving the new bundle (attempt $i)"
            sleep 15
          done
          if [ "$live_sha" != "$local_sha" ]; then
            echo "::error::apex .mcpb mismatch - local $local_sha, live $live_sha"
            exit 1
          fi
          echo "apex .mcpb verified: $live_sha"

  notify:
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.bump != 'patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Send release email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_NOTES: ${{ needs.release.outputs.notes }}
          RELEASE_BUMP: ${{ needs.release.outputs.bump }}
        run: node scripts/notify-release.mjs
