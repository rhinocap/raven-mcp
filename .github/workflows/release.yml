name: Release

# Manual dispatch only. The Friday schedule was removed: an unattended run
# publishes to npm over OIDC without a human in the loop, and a single
# feat(...) commit is enough to make `auto` cut a minor nobody asked for.
# Run it from the Actions tab when a release is actually intended.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto | patch | minor | major)"
        required: false
        default: "auto"
      resume_version:
        description: "Finish a half-deployed release (e.g. 2.5.0). Skips the cut entirely and runs only the tail."
        required: false
        default: ""

# One release at a time. `detect release scope` reads the version from the
# checkout, and `release.sh` deliberately does NOT pull (`scripts/release.sh:48`
# -- pulling would move the tree underneath an already-green test result), so
# two overlapping dispatches can each compute the same next version, and the
# loser then skips its GitHub Release and apex deploy while npm has already
# published. Nothing inside a run reconciles that; only queueing does. Queue instead
# of cancelling: a half-finished release must be allowed to reach its apex step.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      resume: ${{ steps.release.outputs.resume }}
      version: ${{ steps.release.outputs.version }}
      bump: ${{ steps.release.outputs.bump }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail BEFORE the ~10-minute test gate rather than after it. `release.sh`
      # hard-exits when either of these is missing, and it does so AFTER npm ci,
      # Playwright and the full suite have already run. Both are checked here so
      # a misconfigured repo costs seconds, not a full green build that then dies
      # one line into the release script.
      - name: Preflight release credentials
        # A `${{ }}` expression is substituted into the shell SOURCE before bash
        # parses it, so a secret whose value carried shell metacharacters would be
        # executed by the `[ -z ... ]` test rather than tested by it. These are
        # checked for PRESENCE only, so the values never need to reach the source:
        # pass them through `env:` and read them as ordinary variables.
        env:
          RAVEN_REGISTRY_KEY: ${{ secrets.RAVEN_REGISTRY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: |
          missing=0
          if [ -z "$RAVEN_REGISTRY_KEY" ]; then
            echo "::error::secret RAVEN_REGISTRY_KEY is not set. The MCP Registry step (ai.ravenmcp/raven-mcp) cannot run without the ed25519 signing key for ravenmcp.ai domain auth."
            missing=1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::secret VERCEL_TOKEN is not set. The apex .mcpb at ravenmcp.ai is served by the web Vercel project, which has NO git integration, so nothing else in this workflow can move it."
            missing=1
          fi
          # `web/.vercel/` is gitignored (.gitignore:5), so the runner checks out a
          # tree with NO project linkage. A token alone does not say WHICH project
          # to deploy; without these two, `vercel deploy` either fails or links to
          # the wrong project and the apex silently stays stale — the exact failure
          # the verify step below exists to catch, arriving one step earlier.
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::secrets VERCEL_ORG_ID and VERCEL_PROJECT_ID must both be set. They are the web project's linkage (read from web/.vercel/project.json); the runner has no .vercel directory of its own."
            missing=1
          fi
          # The notify job (minor/major only) exits 1 on a missing RESEND pair,
          # and it runs AFTER npm, the Registry, the tag and the apex. Both are
          # already configured in this repo; checking them here means a future
          # rotation that drops one is reported before anything ships rather
          # than as a red job hanging off a completed release.
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_AUDIENCE_ID" ]; then
            echo "::error::secrets RESEND_API_KEY and RESEND_AUDIENCE_ID must both be set. scripts/notify-release.mjs hard-exits without them, in a job that runs after every irreversible step."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      # PRESENCE is not VALIDITY, and the Vercel credentials are not exercised
      # until AFTER npm and the MCP Registry have published. A revoked token, an
      # org id the token cannot reach, or a project id that is not in that org
      # all read as "set" above and then surface as a half-done release with the
      # apex stale. Same shape as the registry signing-key probe: exercise the
      # credential cheaply, here, discard the result. `vercel pull` is the exact
      # command the deploy step runs, so this validates the mechanism rather
      # than a proxy for it, and it runs in a throwaway directory so the tree is
      # not touched. NOT covered by this probe, stated rather than implied:
      # branch protection on main, which needs admin scope to read and is only
      # observable at the push; and production-DEPLOY permission, which is a
      # separate Vercel RBAC grant (`FullProductionDeployment`) from the project
      # READ that `whoami` + `pull` exercise -- a token scoped to read can pass
      # both probes here and still be rejected by `deploy --prod` after npm and
      # the Registry have published. There is no cheap probe for it: the only
      # command that exercises it is a production deploy.
      - name: Preflight Vercel credential validity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          probe=$(mktemp -d)
          cd "$probe"
          if ! npx --yes vercel@59.3.0 whoami --token "$VERCEL_TOKEN"; then
            echo "::error::VERCEL_TOKEN is set but not valid (vercel whoami failed). The apex .mcpb deploy would fail AFTER npm and the MCP Registry have published."
            exit 1
          fi
          if ! npx --yes vercel@59.3.0 pull --yes --environment=production --token "$VERCEL_TOKEN"; then
            echo "::error::VERCEL_ORG_ID/VERCEL_PROJECT_ID do not resolve to a project this token can reach. Read them from web/.vercel/project.json on a linked checkout."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # PINNED, not `@latest`, and the pin is a correctness requirement rather
      # than a supply-chain preference. release.sh resumes a half-finished
      # release by re-packing the tree and comparing the tarball shasum to the
      # one npm already published; tarball byte layout is not stable across npm
      # majors (npm/cli#7610), so a rerun on a newer npm can produce a different
      # shasum from IDENTICAL contents and abort a resume that was correct. The
      # floor is 11.5.1 for OIDC trusted publishing; 11.17.0 is the version the
      # shasum determinism was measured on. Bump it deliberately, and re-measure
      # `npm pack --dry-run --json` against a published version when you do.
      - name: Install pinned npm (OIDC trusted publishing requires 11.5.1+)
        run: |
          npm install -g npm@11.17.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install Playwright chromium (tests render pages)
        run: npx playwright install --with-deps chromium

      - name: Run tests (release gate)
        env:
          RAVEN_NO_USAGE_LOG: "1"
        run: npm test

      # `release.sh` requires the mcp-publisher CLI on PATH and a signing key on
      # disk, and checks for BOTH in its opening guardrails. Neither was ever
      # provided here, so every CI release since the registry step landed
      # (2026-07-28) would have exited 1 before bumping anything. Pinned rather
      # than tracking latest: this is a publishing credential path, and a silent
      # CLI upgrade is not something a release should discover unattended.
      - name: Install mcp-publisher (MCP Registry CLI)
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          tar --extract --gzip --file /tmp/mcp-publisher.tar.gz --directory /tmp mcp-publisher
          sudo install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      # Written to the runner's ephemeral filesystem and pointed at by the same
      # env var release.sh already reads locally, so the script is byte-identical
      # in CI and on Andrew's machine. Registry auth is HTTP domain auth against
      # https://ravenmcp.ai/.well-known/mcp-registry-auth, which needs no
      # interactive step and therefore works unattended.
      - name: Provision MCP Registry signing key
        env:
          RAVEN_REGISTRY_KEY: ${{ secrets.RAVEN_REGISTRY_KEY }}
        run: |
          umask 077
          printf '%s' "$RAVEN_REGISTRY_KEY" > "$HOME/.raven-mcp-registry-key"
          echo "RAVEN_REGISTRY_KEY_FILE=$HOME/.raven-mcp-registry-key" >> "$GITHUB_ENV"
          # `release.sh` only checks the file EXISTS, and it does not attempt a
          # login until AFTER `npm publish` — deliberately, because the registry
          # JWT expires in minutes. So a secret that is set but wrong (a typo, a
          # truncated paste, a key no longer authorized for ravenmcp.ai) is first
          # discovered with npm already irreversibly published. This is a
          # throwaway VALIDITY PROBE, not the release's login: release.sh still
          # mints its own token at the point of use.
          if ! printf '%s' "$RAVEN_REGISTRY_KEY" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::RAVEN_REGISTRY_KEY is not a 64-character hex ed25519 seed. mcp-publisher will reject it, and it would be rejected only after npm publish has already run."
            exit 1
          fi
          mcp-publisher login http --domain ravenmcp.ai --private-key "$RAVEN_REGISTRY_KEY"
          echo "registry key validated against ravenmcp.ai domain auth"

          # Same class as the key probe above, and the same reason: the Registry
          # publish runs AFTER `npm publish`, so a server.json the Registry
          # refuses is discovered with npm already irreversibly shipped. The
          # registry caps `description` at 100 characters and ours has been over
          # it before (175, learned 2026-07-25); it sits at 98 today, which is two
          # characters of headroom, not a margin. `validate` is schema-only and
          # needs no auth, so it costs nothing to run here. The version field is
          # rewritten later by release.sh and is not what this is checking.
          #
          # What this step does NOT establish, stated rather than implied: a
          # green `validate` is a schema and semantic preflight, never a
          # guarantee the publish is accepted. Publish additionally applies
          # server-side checks this cannot see — package ownership on npm, and
          # namespace authorization for ai.ravenmcp/* — so a rejection at
          # publish time remains possible with this step green. release.sh
          # retries that publish with bounded backoff and leaves the version
          # resumable rather than half-released.
          mcp-publisher validate
          echo "server.json validated against the registry schema"

      - name: Configure git identity
        run: |
          git config user.name "raven-bot"
          git config user.email "raven-bot@users.noreply.github.com"

      - name: Detect release scope
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_RESUME_VERSION: ${{ inputs.resume_version }}
        run: node scripts/detect-release-scope.mjs

      - name: Cut release
        id: cut
        if: steps.release.outputs.released == 'true'
        env:
          BUMP: ${{ steps.release.outputs.bump }}
        run: |
          bash scripts/release.sh "$BUMP"
          # Read the version that was ACTUALLY shipped, rather than reusing the
          # one `detect release scope` computed from the checkout. `release.sh`
          # recomputes the bump from the same history and, on a partial release,
          # resumes an already-published version (`scripts/release.sh:170`), so
          # the two can disagree, and every
          # downstream step (tag, GitHub Release, changelog) would then name a
          # version npm never published.
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ONE version for every tail step, whether this run cut the release or is
      # resuming one a previous run left half-deployed. `Cut release` is skipped
      # on a resume, so `steps.cut.outputs.version` is empty there and every step
      # reading it would name `v` -- which is why the tail steps read THIS output
      # and never `steps.cut` directly.
      - name: Resolve the version the tail steps operate on
        id: ver
        if: steps.release.outputs.released == 'true' || steps.release.outputs.resume == 'true'
        env:
          CUT_VERSION: ${{ steps.cut.outputs.version }}
          RESUME_VERSION: ${{ steps.release.outputs.resume_version }}
        run: |
          v="${CUT_VERSION:-$RESUME_VERSION}"
          if [ -z "$v" ]; then
            echo "::error::neither a cut version nor a resume version is set - refusing to run the tail steps against an unnamed release"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "operating on v$v"

      # THE ARTIFACT A RESUME UPLOADS MUST BE THE RELEASED VERSION'S. The bundle
      # is built in this workflow at `scripts/release.sh:117` and, on a resume,
      # again below -- both `site/raven.mcpb` and `web/public/raven.mcpb` are
      # TRACKED, so a resume skipping release.sh uploaded whatever bundle the
      # `main` checkout carried and deployed it to the apex. Whenever main has
      # moved since the tag, that is structurally the wrong artifact, not merely
      # a stale one. Build it from the TAG, in a worktree, so the checkout stays
      # on main for the changelog commit that follows.
      #
      # EXPLICIT RESUMES ONLY, and the exclusion is a correctness argument, not
      # a cost one. An AUTOMATIC resume is detected precisely when main carries
      # zero commits since the tag, or only that tag's own changelog commit
      # (`detect-release-scope.mjs:137`) -- so main's tree and the tag's tree
      # differ in CHANGELOG.md and nothing else, and the tracked bundle already
      # in the checkout IS the released one. Rebuilding it there buys nothing
      # and adds a whole npm install to the one path whose entire job is to
      # recover a tail that already failed once.
      - name: Rebuild the released bundle from its tag (explicit resume only)
        if: steps.release.outputs.explicit_resume == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Deregister before deleting, and prune, so a retry in a reused
          # checkout is not blocked by the previous attempt's registration --
          # `rm -rf` alone leaves the worktree recorded in .git/worktrees.
          git worktree remove --force /tmp/resume-src 2>/dev/null || true
          rm -rf /tmp/resume-src
          git worktree prune
          git worktree add --detach /tmp/resume-src "refs/tags/v$VERSION"
          # `npm ci` in the worktree rather than reusing the root node_modules:
          # the tag's package.json can differ from main's, and the whole point
          # of this step is that the tag is the source of truth.
          ( cd /tmp/resume-src && npm ci && npm run build && SKIP_BUILD=1 npm run build:mcpb )
          # Stage BOTH bundles, then move both. A failure between two sequential
          # `cp`s leaves the checkout carrying one tag-built bundle and one
          # stale one -- two files that are supposed to be byte-identical, and
          # nothing downstream compares them.
          cp /tmp/resume-src/site/raven.mcpb /tmp/site.mcpb.new
          cp /tmp/resume-src/web/public/raven.mcpb /tmp/web.mcpb.new
          mv /tmp/site.mcpb.new site/raven.mcpb
          mv /tmp/web.mcpb.new web/public/raven.mcpb
          cmp site/raven.mcpb web/public/raven.mcpb
          sha256sum site/raven.mcpb web/public/raven.mcpb
          git worktree remove --force /tmp/resume-src || true

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true' || steps.release.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTES and VERSION arrive as ENV, never as `${{ }}` inside the run
          # block. A `${{ }}` expression is substituted into the shell SOURCE
          # before bash parses it, and the notes are built verbatim from merged
          # PR titles (`detect-release-scope.mjs:246`) — so a PR titled
          # `Fix docs $(whoami)` executed during `printf`, in a job holding
          # contents:write, OIDC, and the registry signing key on disk.
          NOTES: ${{ steps.release.outputs.notes }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # QUERIED before it is created. `gh release create` is not
          # duplicate-tolerant: on a resume the release usually already exists
          # and an unconditional create fails the step, taking the changelog,
          # the apex deploy and the apex verify down with it -- the same
          # unfinishable release the resume path exists to fix. Asking first is
          # the only thing that makes this step rerunnable. On an existing
          # release the asset is re-uploaded with --clobber rather than skipped,
          # because the half-finished state this recovers from includes "release
          # created, asset upload failed".
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists - re-uploading the bundle"
            gh release upload "v$VERSION" site/raven.mcpb --clobber
          else
            # A resume never computes notes -- the detector exits before the PR
            # walk -- so on a resume whose ORIGINAL run died before creating
            # the release, $NOTES is empty and an unguarded --notes-file writes
            # a Release with no body and returns 0. The workflow would go green
            # over an incomplete Release. --generate-notes is the honest
            # fallback: GitHub writes the commit/PR summary itself.
            # --verify-tag on BOTH branches. `gh release create` otherwise
            # CREATES a missing tag from current default-branch HEAD, so a
            # version that does not exist becomes a permanent public tag and
            # Release pointing at whatever main is at that moment. The detector
            # already refuses an unknown resume_version; this is the same rule
            # at the second door, and it is the door that reads the REMOTE.
            if [ -s /tmp/release-notes.md ]; then
              gh release create "v$VERSION" \
                --verify-tag \
                --title "v$VERSION" \
                --notes-file /tmp/release-notes.md \
                site/raven.mcpb
            else
              echo "no notes were computed (this is a resume) - letting GitHub generate them"
              gh release create "v$VERSION" \
                --verify-tag \
                --title "v$VERSION" \
                --generate-notes \
                site/raven.mcpb
            fi
            # --generate-notes returning 0 is not evidence of a non-empty body:
            # the whole reason this fallback exists is that the empty-notes path
            # went green over an incomplete Release. Read the body back.
            body=$(gh release view "v$VERSION" --json body --jq .body)
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "::error::Release v$VERSION was created with an empty body"
              exit 1
            fi
          fi

      - name: Rebuild changelog page
        if: steps.release.outputs.released == 'true' || steps.release.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-changelog.mjs

      - name: Commit changelog + push
        if: steps.release.outputs.released == 'true' || steps.release.outputs.resume == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git add site/changelog.html
          if ! git diff --cached --quiet; then
            git commit -m "Update changelog for v$VERSION"
            git push
          fi

      # THE FOURTH SURFACE. npm, the MCP Registry record and the git tag are all
      # handled by release.sh; the public download at https://ravenmcp.ai/raven.mcpb
      # is not, because the apex is served by the `web` Vercel project and `web`
      # has NO git integration - a push to main will never move it. It stayed one
      # release behind through a fully successful release.sh run (v2.5.0,
      # 2026-08-17) for exactly this reason. release.sh prints a reminder; a
      # workflow has nobody to read one, so the step lives here.
      - name: Deploy apex marketing site (publishes the new .mcpb)
        if: steps.release.outputs.released == 'true' || steps.release.outputs.resume == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The documented CI linkage mechanism. `vercel pull` was here first and
          # was wrong: it resolves the project from `web/.vercel/`, which is
          # gitignored and therefore absent on the runner.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: web
        run: |
          npx --yes vercel@59.3.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@59.3.0 build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@59.3.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      # Read the bytes back off the live apex rather than trusting the deploy's
      # own exit code: a green deploy of a stale tree is the exact failure this
      # step exists to catch. Compares the served bundle to the one just built.
      - name: Verify the apex .mcpb is the bundle we just built
        if: steps.release.outputs.released == 'true' || steps.release.outputs.resume == 'true'
        run: |
          # pipefail is load-bearing, not hygiene. Both sha reads are
          # `sha256sum ... | cut`, and `cut` exits 0 on empty input, so without
          # it a sha256sum that fails on BOTH sides leaves local_sha and
          # live_sha empty and the equality test below reports the apex
          # VERIFIED. A check whose failure mode is indistinguishable from its
          # success mode is not a check.
          set -o pipefail
          local_sha=$(sha256sum web/public/raven.mcpb | cut -d" " -f1)
          if [ -z "$local_sha" ]; then
            echo "::error::could not read the local bundle sha - refusing to verify"
            exit 1
          fi
          echo "local bundle: $local_sha"
          live_sha=""
          for i in 1 2 3 4 5 6; do
            # Download to a FILE first. Piping curl into sha256sum hides a failed
            # fetch: without pipefail the pipeline reports sha256sum's status, so
            # a 404 or a reset connection yields the sha256 of empty input
            # (e3b0c442...) and is compared as though it were a served bundle.
            # `|| true` keeps a transient failure inside the retry loop rather
            # than letting `set -e` abort on the first one.
            curl --fail --silent --show-error --location \
              --output /tmp/apex-raven.mcpb https://ravenmcp.ai/raven.mcpb || true
            if [ -s /tmp/apex-raven.mcpb ]; then
              live_sha=$(sha256sum /tmp/apex-raven.mcpb | cut -d" " -f1)
            else
              live_sha="<fetch failed>"
            fi
            [ "$live_sha" = "$local_sha" ] && break
            echo "apex not yet serving the new bundle (attempt $i, live $live_sha)"
            sleep 15
          done
          if [ "$live_sha" != "$local_sha" ]; then
            echo "::error::apex .mcpb mismatch - local $local_sha, live $live_sha"
            exit 1
          fi
          echo "apex .mcpb verified: $live_sha"

  notify:
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.bump != 'patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Send release email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_NOTES: ${{ needs.release.outputs.notes }}
          RELEASE_BUMP: ${{ needs.release.outputs.bump }}
        run: node scripts/notify-release.mjs
