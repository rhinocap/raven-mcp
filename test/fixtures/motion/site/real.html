<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Studio, live</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f4f2ee; color: #1d1d1f; }
  /* A floating pill nav: fixed, away from the top edge, narrower than the page. */
  header#pill { position: fixed; top: 16px; left: 20%; width: 60%; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; background: #ffffff; border-radius: 28px; z-index: 5; }
  header#pill ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
  header#pill a { color: #1d1d1f; text-decoration: none; font-size: 15px; }
  a#login { background: #e4e4e4; color: #1d1d1f; padding: 8px 14px; border-radius: 6px; }
  section#hero { position: relative; padding: 160px 48px 96px; min-height: 420px; box-sizing: border-box; overflow: hidden; }
  .glow { position: absolute; left: 30%; top: 40px; width: 360px; height: 360px; border-radius: 50%; background: #39d0ff; filter: blur(60px); opacity: .5; }
  h1 { position: relative; font-size: 64px; line-height: 1.1; font-weight: 400; margin: 0 0 32px; }
  a#start { position: relative; display: inline-block; background: #ff4f00; color: #ffffff; padding: 14px 24px; border-radius: 8px; text-decoration: none; font-size: 16px; }
  section#tiles { padding: 48px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .tile { background: #ffffff; border-radius: 12px; padding: 16px; }
  .tile img { display: block; width: 100%; height: 140px; }
  .tile h3 { font-size: 18px; margin: 12px 0 0; }
  .tile.raised { box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
  section#late { margin-top: 1400px; padding: 96px 48px; }
  .reveal { opacity: 0; transition: opacity .2s; }
  .reveal.in { opacity: 1; }
  h2 { font-size: 36px; margin: 0 0 16px; }
  /* A cookie notice: fixed, bottom left. */
  div#cookies { position: fixed; left: 24px; bottom: 24px; width: 280px; padding: 16px; background: #ffffff; border-radius: 12px; z-index: 9; }
  div#cookies button { background: #1d1d1f; color: #ffffff; border: 0; padding: 10px 16px; border-radius: 6px; font: inherit; }
</style>
</head>
<body>
  <header id="pill">
    <span class="brand">Field Studio</span>
    <nav id="pill-nav"><ul>
      <li><div class="item"><a href="#work">Work</a></div></li>
      <li><div class="item"><a href="#pricing">Pricing</a></div></li>
      <li><div class="item"><a href="#journal">Journal</a></div></li>
    </ul></nav>
    <a id="login" href="#login">Log in</a>
  </header>
  <section id="hero">
    <div class="glow"></div>
    <h1>Sites for small studios</h1>
    <a id="start" href="#start">Start a project</a>
  </section>
  <section id="tiles">
    <article class="tile"><img src="images/card.png" alt="Harbour cafe"><h3>Harbour Cafe</h3></article>
    <article class="tile raised delay-1"><img src="images/card.png" alt="North press"><h3>North Press</h3></article>
    <article class="tile delay-2"><img src="images/card.png" alt="Loom studio"><h3>Loom Studio</h3></article>
    <article class="tile delay-3"><img src="images/card.png" alt="Pine and co"><h3>Pine and Co</h3></article>
  </section>
  <section id="late" class="reveal">
    <h2>How a project runs</h2>
    <p>Four weeks, one call a week, and a site you can edit yourself.</p>
  </section>
  <site-footer><template shadowrootmode="open"><footer style="padding:48px"><a href="#privacy">Privacy</a></footer></template></site-footer>
  <div id="cookies" role="dialog" aria-label="Cookies">
    <p>We use cookies to count visits.</p>
    <button type="button">Accept cookies</button>
    <button type="button">Reject cookies</button>
  </div>
  <script>
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("in"); });
    }).observe(document.getElementById("late"));
  </script>
</body>
</html>
