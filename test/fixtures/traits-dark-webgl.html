<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traits Dark WebGL</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 1800px;
      background: #05070a;
      color: #f7fbff;
      font-family: "Inter", system-ui, sans-serif;
    }

    .hero {
      min-height: 900px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.38), transparent 38%);
    }

    h1 {
      margin: 0;
      font-size: 84px;
      line-height: 1;
    }

    canvas {
      width: 640px;
      height: 280px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      animation: pulse 1.4s linear infinite;
    }

    .glass {
      margin-top: 24px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
    }

    .scroll-cue {
      margin-top: 720px;
      opacity: 0;
      transform: translateY(80px);
      transition: opacity 800ms ease, transform 800ms ease;
    }

    @keyframes pulse {
      from { opacity: 0.58; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section>
      <h1>Midnight Signal</h1>
      <canvas id="stage" width="640" height="280"></canvas>
      <div class="glass">Layered glass interface</div>
      <div class="scroll-cue">Offscreen choreographed section</div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('stage');
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (gl) {
      gl.clearColor(0.02, 0.03, 0.05, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
  </script>
</body>
</html>
