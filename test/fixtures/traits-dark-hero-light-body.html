<!doctype html>
<html>
<head><title>Dark hero, default body</title>
<style>
  /* body intentionally left default-white: the ground the user SEES is the wrapper */
  .app { position: fixed; inset: 0; background: #0a0a0c; color: #f5f5f5; overflow: auto; }
  h1 { font-size: 72px; }
</style>
</head>
<body>
  <div class="app">
    <main>
      <section><h1>Night mode</h1><p>The wrapper paints the whole viewport dark while body stays default.</p></section>
    </main>
  </div>
</body>
</html>
