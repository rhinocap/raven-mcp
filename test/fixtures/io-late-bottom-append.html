<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Late Bottom Append Fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .scene { min-height: 760px; opacity: 0; transition: opacity 100ms linear; }
    .scene.revealed { opacity: 1; }
  </style>
</head>
<body>
  <section class="scene"><h1>Initial scene</h1></section>
  <section class="scene"><h2>First bottom scene</h2></section>
  <script>
    (function () {
      var reachedBottom = false;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
          if (!reachedBottom && entry.target.textContent.indexOf('First bottom') !== -1) {
            reachedBottom = true;
            setTimeout(function () {
              var scene = document.createElement('section');
              scene.className = 'scene late-scene';
              scene.innerHTML = '<h2>Late scene after bottom</h2>';
              observer.observe(scene);
              document.body.appendChild(scene);
            }, 300);
          }
        });
      }, { threshold: 0.5 });
      Array.prototype.forEach.call(document.querySelectorAll('.scene'), function (scene) {
        observer.observe(scene);
      });
    })();
  </script>
</body>
</html>
