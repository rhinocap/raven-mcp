<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme wipe fixture</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100vh;
      background: #101014;
    }

    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .theme-fab {
      position: relative;
      z-index: 2;
      appearance: none;
      border: 1px solid #5f5f70;
      border-radius: 999px;
      background: #242430;
      color: #f4f4ff;
      cursor: pointer;
      font: inherit;
      padding: 12px 18px;
    }

    .theme-fab:hover ~ .wash {
      opacity: 1;
    }

    .wash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      transition: none;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <button class="theme-fab">theme</button>
  <div class="wash" aria-hidden="true"></div>
</body>
</html>
